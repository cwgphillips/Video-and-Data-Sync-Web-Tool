<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video & IMU Analysis Tool</title>
  <!-- uPlot Styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212; color: #e0e0e0; margin: 20px;
      display: flex; flex-direction: column; align-items: center;
    }
    .app-container { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 960px; }
    .drop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .drop-zone {
      border: 2px dashed #444; border-radius: 6px; padding: 18px;
      text-align: center; background: #1a1a1a; cursor: pointer;
    }
    .drop-zone.dragover { border-color: #50fa7b; }
    canvas#videoCanvas { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; display: block; }
    #chartContainer { width: 100%; min-height: 240px; background: #1a1a1a; border-radius: 6px; overflow: hidden; }
    .controls { display: flex; gap: 10px; align-items: center; background: #1e1e1e; padding: 10px 14px; border-radius: 6px; }
    button { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
    button:hover:not(:disabled) { background: #383838; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #timeline { flex-grow: 1; cursor: pointer; }
    .status-bar { font-family: monospace; font-size: 0.85rem; color: #aaa; display: flex; justify-content: space-between; }
  </style>

  <!-- External scripts -->
  <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.iife.min.js"></script>
</head>
<body>

<div class="app-container">
  <div class="drop-grid">
    <div id="videoDrop" class="drop-zone">
      <span>Drop MP4 Video Here</span>
      <input type="file" id="videoInput" accept="video/mp4" style="display:none">
    </div>
    <div id="csvDrop" class="drop-zone">
      <span>Drop IMU CSV Log Here</span>
      <input type="file" id="csvInput" accept=".csv" style="display:none">
    </div>
  </div>

  <canvas id="videoCanvas"></canvas>

  <div class="controls">
    <button id="btnStepBack" disabled>◀ -1 Frame</button>
    <button id="btnPlay" disabled>Play</button>
    <button id="btnStepFwd" disabled>+1 Frame ▶</button>
    <input type="range" id="timeline" min="0" max="0" value="0" disabled>
  </div>

  <div class="status-bar">
    <span id="frameReadout">Frame: 0 / 0</span>
    <span id="timeReadout">PTS: 0.000s</span>
  </div>

  <!-- uPlot graph mount point -->
  <div id="chartContainer"></div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
